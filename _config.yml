# Site identity
title: blank
first_name: Xiaotian
middle_name:
last_name: Liu
contact_note: >
  (+1) 313-467-4124
description: >
  Academic website of Xiaotian Liu, a PhD candidate at Georgia Institute of Technology studying operations management and artificial intelligence.
keywords: operations management, artificial intelligence, reinforcement learning, inventory control
lang: en
icon: 

# Set these two values before publishing under a custom domain or project path.
url: "https://xiaotianliu01.github.io"
baseurl: ""

# Layout
back_to_top: true
enable_progressbar: true
max_width: 1000px

# Content collections used by the current site
collections:
  news:
    output: false
  teachings:
    output: true

# Jekyll
markdown: kramdown
kramdown:
  input: GFM

include: ["_pages"]
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll/scholar
  - jekyll-sitemap

sass:
  style: compressed

# Publications
scholar:
  last_name: [Liu]
  first_name: [Xiaotian, X.]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending

# Only the external libraries referenced by the retained templates.
third_party_libraries:
  google_fonts:
    url:
      fonts: "https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap"
  jquery:
    integrity:
      js: "sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    url:
      js: "https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"
  mdb:
    integrity:
      css: "sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw="
    url:
      css: "https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/css/mdb.min.css"
